<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Brief quotidien</title><style>:root{--bg:#070b14;--text:#f7f9ff;--muted:#a8b3c9;--line:rgba(255,255,255,.105);--blue:#88b4ff;--mint:#73efc5;--amber:#ffd17f;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(circle at 86% -8%,rgba(101,135,255,.22),transparent 34%),radial-gradient(circle at -10% 108%,rgba(67,224,181,.12),transparent 38%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow-x:hidden}button,a{font:inherit}.app{width:min(100%,820px);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:20;padding:15px 3px 10px;background:linear-gradient(180deg,rgba(7,11,20,.99) 65%,transparent)}.eyebrow{color:var(--mint);font-size:.71rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(1.55rem,6.5vw,2.45rem);line-height:1.02;letter-spacing:-.035em;margin:.42rem 0 .35rem}.date{color:var(--muted);font-size:.87rem}.modes{display:flex;gap:6px;margin-top:11px;overflow:auto}.mode{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:.78rem;font-weight:760;white-space:nowrap}.mode.active{background:var(--text);color:#0d1422}.progress{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .4s var(--ease)}.view{display:none}.view.active{display:block}.stage{height:calc(100dvh - 170px);min-height:570px;display:grid;place-items:center;padding:8px 1px 92px}.card{width:100%;height:min(650px,calc(100dvh - 212px));min-height:500px;border-radius:30px;overflow:hidden;background:linear-gradient(145deg,rgba(27,39,64,.99),rgba(13,20,34,.995));border:1px solid var(--line);box-shadow:0 26px 85px rgba(0,0,0,.52);display:flex;flex-direction:column;touch-action:none;user-select:none;will-change:transform,opacity}.card.animate{transition:transform .48s var(--ease),opacity .42s var(--ease)}.visual{height:38%;min-height:170px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(109,148,255,.18),rgba(77,243,199,.05));font-size:5rem}.content{padding:19px 21px 22px;display:flex;flex-direction:column;flex:1}.meta{display:flex;justify-content:space-between;gap:10px}.category{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.badge{font-size:.69rem;font-weight:760;padding:6px 9px;border-radius:999px;background:rgba(136,180,255,.13);border:1px solid rgba(136,180,255,.28)}.card h2{font-size:clamp(1.48rem,5.8vw,2.22rem);line-height:1.04;letter-spacing:-.03em;margin:15px 0 11px}.summary{color:#dce5f6;font-size:1.01rem;line-height:1.48}.footer{margin-top:auto;display:flex;justify-content:space-between;color:var(--muted);font-size:.77rem;padding-top:13px}.controls{position:fixed;z-index:25;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;padding:9px;background:rgba(11,17,29,.78);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px}.control{border:0;width:52px;height:52px;border-radius:50%;color:var(--text);background:#1a2439;font-size:1.25rem}.control.main{background:linear-gradient(145deg,#88b4ff,#698af0);color:#06101f}.grid{display:grid;grid-template-columns:1fr;gap:11px;padding:7px 0 92px}.grid button,.history a{border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.05);padding:16px;text-align:left;color:var(--text);text-decoration:none}.grid small{color:var(--mint);font-weight:820;text-transform:uppercase}.grid h3{margin:.55rem 0 .35rem;font-size:1.08rem}.grid p{margin:0;color:var(--muted);line-height:1.4}.reader{padding:8px 0 94px}.article{border-bottom:1px solid var(--line);padding:19px 4px 23px}.article .tag{color:var(--mint);font-size:.72rem;font-weight:850;text-transform:uppercase}.article h2{font-size:1.42rem;line-height:1.12}.article p{color:#dce4f4;line-height:1.62}.sources a{display:inline-block;color:#dbe7ff;text-decoration:none;border:1px solid rgba(136,180,255,.27);background:rgba(136,180,255,.08);padding:8px 10px;border-radius:12px;font-size:.8rem;margin:4px 4px 0 0}.history{display:grid;gap:10px;padding:10px 0 90px}.history a small{color:var(--muted)}.sheetback{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}.sheetback.open{opacity:1;pointer-events:auto}.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,820px);max-height:87dvh;overflow:auto;background:#111a2b;border:1px solid var(--line);border-radius:29px 29px 0 0;padding:14px 20px max(27px,env(safe-area-inset-bottom));transition:transform .45s var(--ease)}.sheetback.open .sheet{transform:translate(-50%,0)}.close{float:right;border:0;color:#fff;background:rgba(255,255,255,.09);width:38px;height:38px;border-radius:50%}.sheet h3{color:var(--amber);font-size:.78rem;text-transform:uppercase}.sheet p{line-height:1.6;color:#dce4f4}.loading{padding:40px 5px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header><div class="eyebrow">Brief quotidien interactif</div><h1 id="title">IA, technologie, science & ophtalmologie</h1><div class="date" id="date">Chargement…</div><div class="modes"><button class="mode active" data-mode="cards">Cartes</button><button class="mode" data-mode="summary">Sommaire</button><button class="mode" data-mode="reader">Lecture</button><button class="mode" data-mode="history">Historique</button></div><div class="progress"><div id="bar"></div></div></header><section class="view active" id="cardsView"><div class="stage"><article class="card" id="card"><div class="loading">Chargement du brief…</div></article></div><nav class="controls"><button class="control" id="prev">↑</button><button class="control main" id="open">＋</button><button class="control" id="next">↓</button></nav></section><section class="view" id="summaryView"><div class="grid" id="grid"></div></section><section class="view" id="readerView"><div class="reader" id="reader"></div></section><section class="view" id="historyView"><div class="history" id="history"></div></section></div><div class="sheetback" id="back"><section class="sheet"><button class="close" id="close">×</button><div id="sheet"></div></section></div><script>let cards=[],idx=0,startY=0,startT=0,drag=false,moved=false,currentDate='';const card=document.getElementById('card'),bar=document.getElementById('bar'),back=document.getElementById('back'),sheet=document.getElementById('sheet');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(date){const data=await fetch(`briefs/${date}.json?v=${Date.now()}`).then(r=>r.json());cards=data.cards;idx=0;currentDate=data.date;document.getElementById('title').textContent=data.title;document.getElementById('date').textContent=`${data.label} · ${cards.length} cartes`;build();setMode('cards')}async function init(){const list=await fetch(`briefs/index.json?v=${Date.now()}`).then(r=>r.json());document.getElementById('history').innerHTML=list.map(x=>`<a href="#${x.date}" data-date="${x.date}"><strong>${esc(x.label)}</strong><br><small>${esc(x.summary)}</small></a>`).join('');document.getElementById('history').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();location.hash=a.dataset.date;load(a.dataset.date)};const wanted=location.hash.slice(1);await load(wanted||list[0].date)}function render(dir=0){const x=cards[idx];card.innerHTML=`<div class="visual">${x.e}</div><div class="content"><div class="meta"><div class="category">${esc(x.c)}</div><div class="badge">${esc(x.i)}</div></div><h2>${esc(x.t)}</h2><div class="summary">${esc(x.s)}</div><div class="footer"><span>${idx+1} / ${cards.length}</span><span>Toucher pour approfondir ⤴</span></div></div>`;bar.style.width=`${(idx+1)/cards.length*100}%`;if(dir){card.style.transition='none';card.style.transform=`translateY(${dir>0?90:-90}px) scale(.965)`;card.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{card.classList.add('animate');card.style.transform='translateY(0)';card.style.opacity='1'}))}}function go(dir){const n=Math.max(0,Math.min(cards.length-1,idx+dir));if(n===idx){card.classList.add('animate');card.style.transform='';card.style.opacity='1';return}card.classList.add('animate');card.style.transform=`translateY(${dir>0?-720:720}px) rotate(${dir>0?-2:2}deg)`;card.style.opacity='0';setTimeout(()=>{idx=n;card.classList.remove('animate');render(dir)},320)}function openSheet(i=idx){const x=cards[i],links=x.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])} ↗</a>`).join('');sheet.innerHTML=`<div class="category">${esc(x.c)} · ${esc(x.i)}</div><h2>${esc(x.t)}</h2><p><strong>${esc(x.s)}</strong></p><h3>Détails</h3><p>${esc(x.d)}</p><h3>Analyse</h3><p>${esc(x.a)}</p><div class="sources">${links}</div>`;back.classList.add('open');document.body.style.overflow='hidden'}function closeSheet(){back.classList.remove('open');document.body.style.overflow=''}function build(){render();const grid=document.getElementById('grid'),reader=document.getElementById('reader');grid.innerHTML=cards.map((x,i)=>`<button data-i="${i}"><small>${esc(x.c)} · ${esc(x.i)}</small><h3>${esc(x.t)}</h3><p>${esc(x.s)}</p></button>`).join('');grid.onclick=e=>{const b=e.target.closest('button');if(!b)return;idx=Number(b.dataset.i);setMode('cards');render();openSheet(idx)};reader.innerHTML=cards.map(x=>`<article class="article"><div class="tag">${esc(x.c)} · ${esc(x.i)}</div><h2>${esc(x.t)}</h2><p><strong>${esc(x.s)}</strong></p><p>${esc(x.d)}</p><p><strong>Analyse :</strong> ${esc(x.a)}</p><div class="sources">${x.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])} ↗</a>`).join('')}</div></article>`).join('')}card.addEventListener('pointerdown',e=>{drag=true;moved=false;startY=e.clientY;startT=performance.now();card.setPointerCapture(e.pointerId);card.classList.remove('animate')});card.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-startY;if(Math.abs(dy)>7)moved=true;card.style.transform=`translateY(${dy*.72}px) rotate(${dy*.006}deg)`;card.style.opacity=String(Math.max(.62,1-Math.abs(dy)/800))});card.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const dy=e.clientY-startY,v=dy/Math.max(16,performance.now()-startT);if(Math.abs(dy)>62||Math.abs(v)>.48)go(dy<0?1:-1);else{card.classList.add('animate');card.style.transform='';card.style.opacity='1';if(!moved&&cards.length)openSheet()}});document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('open').onclick=()=>cards.length&&openSheet();document.getElementById('close').onclick=closeSheet;back.onclick=e=>{if(e.target===back)closeSheet()};function setMode(m){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(m==='cards'?'cardsView':m==='summary'?'summaryView':m==='reader'?'readerView':'historyView').classList.add('active');bar.parentElement.style.display=m==='cards'?'block':'none'}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));init().catch(e=>{card.innerHTML='<div class="loading">Impossible de charger le brief. Recharge la page dans quelques secondes.</div>';console.error(e)});</script></body></html>
